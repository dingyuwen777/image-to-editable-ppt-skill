name: Patch Web Batch Changelog

on:
  push:
    branches:
      - feature/web-batch-reconstruction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-batch-reconstruction
          fetch-depth: 0
      - name: Add unreleased entries once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "Add low-API ChatGPT Web batch handoff"
          if marker in text:
              print("Changelog already contains web batch entries.")
              raise SystemExit(0)
          anchor = "## Unreleased\n"
          block = """

          ### Features

          - Add low-API ChatGPT Web batch handoff, verified reconstruction import, deterministic local build/finalize, and failed-page revision rounds through `editppt web` and `editppt revision` commands.
          - Add the `web-artifact` backend so web-generated assets can be imported with provenance and integrity checks without OpenAI API credentials or Codex OAuth.

          ### Fixes

          - Use the requested DPI when normalizing legacy `.ppt` files, and add cross-platform ImageMagick and CJK font discovery for Web Batch previews.

          ### Documentation

          - Add the ChatGPT Web Skill, bundle protocol, Chinese usage guide, troubleshooting guide, global objective, design specification, and implementation plan for the batch workflow.
          """
          if anchor not in text:
              raise SystemExit("Missing Unreleased heading")
          path.write_text(text.replace(anchor, anchor + block, 1), encoding="utf-8")
          PY
      - name: Commit changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for web batch workflow"
          git push origin HEAD:feature/web-batch-reconstruction
